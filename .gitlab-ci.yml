---
# Self-contained lint pipeline: ansible-lint (production profile), yamllint,
# terraform fmt/validate and tflint. Nothing here talks to real infrastructure.
stages:
  - lint

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

ansible-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet "ansible-core==2.22.0" "ansible-lint==26.10.1" "yamllint==1.38.0"
    - ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
  script:
    - yamllint .
    - cd ansible && ansible-lint

terraform:
  stage: lint
  image:
    name: hashicorp/terraform:1.17.1
    entrypoint: [""]
  script:
    - cd terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate

tflint:
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:v0.65.0
    entrypoint: [""]
  script:
    - cd terraform
    - tflint --init
    - tflint
