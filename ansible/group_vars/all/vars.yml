---
# The VM from terraform/ has four disks: sda (OS) and sdb, sdc, sdd for LVM.
# lvm_demo builds the starting point of the "Adding a Larger PV and Migrating Data" scenario:
# volume group my_volume_group on two PVs (sdb, sdc) with a 15 GiB ext4 LV that spans both.
# On your own machine set lvm_demo_enabled: false and use your own VG, PVs and LV.
lvm_demo_enabled: true
lvm_demo_vg: my_volume_group
lvm_demo_pvs:
  - /dev/sdb
  - /dev/sdc
lvm_demo_lv: my_logical_volume
lvm_demo_lv_size: 15g
lvm_demo_mount: /data

lvm_pv_vg_vg: "{{ lvm_demo_vg }}"
# Add the larger disk and move everything onto it, then drop the two small PVs.
lvm_pv_vg_new_pvs:
  - /dev/sdd
lvm_pv_vg_retire_pvs:
  - /dev/sdb
  - /dev/sdc
# After growing sdd at the hypervisor, list it here and run site.yml again.
lvm_pv_vg_resize_pvs: []
lvm_pv_vg_lv: "{{ lvm_demo_lv }}"
lvm_pv_vg_lv_size: "+100%FREE"
